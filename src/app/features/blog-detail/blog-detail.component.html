<div *ngIf="isLoading()" class="container section">
  <app-loading-skeleton [count]="1" [columns]="1"></app-loading-skeleton>
</div>

<div *ngIf="!isLoading() && (hasError() || !blog())" class="container section">
  <app-error-state
    title="Article Not Found"
    message="We could not find the requested blog article."
    [showRetry]="false">
  </app-error-state>
</div>

<article *ngIf="!isLoading() && blog()" class="blog-detail-wrapper">
  <!-- Header -->
  <header class="post-header">
    <div class="container">
      <!-- <app-breadcrumb [items]="[{ label: 'Blog', url: '/blog' }, { label: blog()!.title }]"></app-breadcrumb> -->
      <span class="category-badge">{{ blog()?.category }}</span>
      <h1 class="post-title">{{ blog()?.title }}</h1>
      <div class="post-meta">
        <span>Written by {{ blog()?.author }}</span>
        <span>•</span>
        <span>{{ blog()?.publishDate | date: 'longDate' }}</span>
      </div>
    </div>
  </header>

  <!-- Featured Image -->
  <div class="container image-container">
    <img
      [src]="imageService.processImageUrl(blog()?.featuredImage)"
      [alt]="blog()?.title"
      (error)="imageService.handleImageError($event)"
      class="featured-img" />
  </div>

  <!-- Main Body Content -->
  <section class="section post-body-section">
    <div class="container body-container card-glass">
      <div class="markdown-body" [innerHTML]="renderedHtml()"></div>
    </div>
  </section>

  <!-- CTA Banner -->
  <app-cta-banner></app-cta-banner>
</article>
